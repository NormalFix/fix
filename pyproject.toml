[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fix-agent"
version = "1.0.0-beta"
description = "Fix v1.0.0-beta: Autonomous AI Engineering Partner with Mind Mirror, Polyglot Semantic Radar, Executable Skills & Full-Screen TUI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "NormalFix" }
]
dependencies = [
    "pydantic>=2.6.0",
    "httpx>=0.26.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "prompt_toolkit>=3.0.40",
]

[project.urls]
Homepage = "https://github.com/NormalFix/fix"
Repository = "https://github.com/NormalFix/fix"
Issues = "https://github.com/NormalFix/fix/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
fix = "fix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
